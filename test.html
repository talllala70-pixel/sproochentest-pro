<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🧪 اختبار Sproochentest Pro</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--text:#22242a;--muted:#5a6472;--a1:#b5762a;--a2:#2f8f78;--a3:#b13f3f;--bd:#e4ddcc}
@media(prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#17212b;--text:#e8edf2;--muted:#9fb1c1;--a1:#e0a458;--a2:#5cb8a4;--a3:#d16d6d;--bd:#2a3b4a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.7;padding:20px}
.wrap{max-width:900px;margin:0 auto}
h1{color:var(--a1);text-align:center;margin:0 0 6px;font-size:1.5em}
.sub{text-align:center;color:var(--muted);font-size:.9em;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:1.1em;color:var(--a2)}
.test{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--bd);font-size:.92em}
.test:last-child{border-bottom:none}
.test .ico{font-size:1.2em;line-height:1;flex-shrink:0;width:24px;text-align:center}
.test .body{flex:1;min-width:0}
.test .body b{display:block;color:var(--a1);font-size:.95em}
.test .body small{color:var(--muted);font-size:.82em;word-break:break-word;direction:ltr;display:block;margin-top:2px}
.test.pass .ico::before{content:"✅"}
.test.fail .ico::before{content:"❌"}
.test.warn .ico::before{content:"⚠️"}
.test.skip .ico::before{content:"⏭️"}
.test.pass{border-inline-start:4px solid var(--a2)}
.test.fail{border-inline-start:4px solid var(--a3)}
.test.warn{border-inline-start:4px solid var(--a1)}
.summary{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:20px;text-align:center;margin-bottom:16px}
.summary .score{font-size:3em;font-weight:800;color:var(--a1);line-height:1}
.summary .label{color:var(--muted);font-size:.9em;margin-top:4px}
.summary.great{border-color:var(--a2)}
.summary.great .score{color:var(--a2)}
.summary.bad{border-color:var(--a3)}
.summary.bad .score{color:var(--a3)}
.btn{background:var(--card);border:1px solid var(--bd);color:var(--text);padding:10px 20px;border-radius:10px;cursor:pointer;font:inherit;font-size:1em;font-weight:700;margin:6px 4px;transition:.15s}
.btn:hover{background:var(--a1);color:#fff;border-color:var(--a1)}
.btn.main{background:var(--a1);color:#fff;border-color:var(--a1)}
.actions{text-align:center;margin:20px 0}
pre{background:#000;color:#0f0;padding:12px;border-radius:8px;overflow:auto;font-size:.8em;direction:ltr;text-align:left}
</style>
</head>
<body>
<div class="wrap">
<h1>🧪 اختبار شامل</h1>
<p class="sub">فحص تلقائي لكل ميزات Sproochentest Pro</p>
<div class="summary" id="summary">
  <div class="score" id="score">...</div>
  <div class="label" id="label">جارٍ الاختبار...</div>
</div>
<div class="actions">
  <button class="btn main" onclick="runAllTests()">🔄 إعادة التشغيل</button>
  <button class="btn" onclick="window.open('./index.html','_blank')">🚀 افتح التطبيق</button>
</div>
<div id="results"></div>
<details class="card" style="margin-top:20px">
  <summary style="cursor:pointer;font-weight:700;color:var(--a1)">🔍 معلومات التشخيص</summary>
  <div><pre id="diagnostics"></pre></div>
</details>
</div>

<script>
const TESTS = [];
function test(name, hint, fn){ TESTS.push({name, hint, fn}); }
let _results = [];

async function runOne(t){
  try{
    const r = await t.fn();
    if(r === true || r === undefined) return {state:'pass', msg:'OK'};
    if(r === 'skip') return {state:'skip', msg:'تم التخطي'};
    if(typeof r === 'object' && r.state) return r;
    return {state:'fail', msg:String(r)};
  }catch(e){ return {state:'fail', msg:e.message || String(e)}; }
}

async function runAllTests(){
  _results = [];
  document.getElementById('results').innerHTML = '<div class="card"><h2>⏳ جارٍ التشغيل...</h2></div>';
  for(const t of TESTS){
    const r = await runOne(t);
    _results.push({name:t.name, hint:t.hint, ...r});
  }
  renderResults(); updateSummary(); renderDiagnostics();
}

function renderResults(){
  const container = document.getElementById('results');
  const byGroup = {};
  _results.forEach(r=>{
    const group = r.name.split(' — ')[0];
    if(!byGroup[group]) byGroup[group] = [];
    byGroup[group].push(r);
  });
  let html = '';
  Object.keys(byGroup).forEach(g=>{
    html += '<div class="card"><h2>'+esc(g)+'</h2>';
    byGroup[g].forEach(r=>{
      html += '<div class="test '+r.state+'"><div class="ico"></div><div class="body"><b>'+esc(r.name)+'</b><small>'+esc(r.hint)+' — '+esc(r.msg)+'</small></div></div>';
    });
    html += '</div>';
  });
  container.innerHTML = html;
}

function updateSummary(){
  const pass = _results.filter(r=>r.state==='pass').length;
  const fail = _results.filter(r=>r.state==='fail').length;
  const warn = _results.filter(r=>r.state==='warn').length;
  const skip = _results.filter(r=>r.state==='skip').length;
  const total = _results.length;
  const score = total ? Math.round(pass/(total-skip||1)*100) : 0;
  const s = document.getElementById('summary');
  s.className = 'summary' + (fail ? ' bad' : (score >= 90 ? ' great' : ''));
  document.getElementById('score').textContent = score + '%';
  document.getElementById('label').innerHTML = '✅ '+pass+' نجح · ❌ '+fail+' فشل · ⚠️ '+warn+' تحذير · ⏭️ '+skip+' متخطى · الإجمالي '+total;
}

function renderDiagnostics(){
  const info = {
    url: location.href, protocol: location.protocol, hostname: location.hostname,
    userAgent: navigator.userAgent, online: navigator.onLine,
    localStorage: !!window.localStorage, serviceWorker: 'serviceWorker' in navigator,
    caches: 'caches' in window, speech: 'speechSynthesis' in window,
    isSecureContext: window.isSecureContext,
    standalone: window.matchMedia('(display-mode: standalone)').matches,
    screenSize: window.innerWidth + '×' + window.innerHeight,
    reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
    darkMode: window.matchMedia('(prefers-color-scheme: dark)').matches,
  };
  document.getElementById('diagnostics').textContent = JSON.stringify(info, null, 2);
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

test('البيئة — البروتوكول', 'يجب أن يكون http أو https', async()=>{
  if(!location.protocol.startsWith('http')) return {state:'fail', msg:'البروتوكول: '+location.protocol};
  return {state:'pass', msg:location.protocol};
});
test('البيئة — سياق آمن', 'HTTPS أو localhost', async()=>{
  return {state: window.isSecureContext?'pass':'warn', msg: window.isSecureContext?'نعم':'لا'};
});
test('البيئة — localStorage', 'حفظ التقدم', async()=>{
  if(!window.localStorage) return 'localStorage غير متاح';
  localStorage.setItem('_t_','1'); const v=localStorage.getItem('_t_'); localStorage.removeItem('_t_');
  return v==='1' ? {state:'pass',msg:'متاح ✓'} : 'فشل';
});
test('البيئة — Service Worker', '', async()=>{
  if(!('serviceWorker' in navigator)) return {state:'warn', msg:'غير مدعوم'};
  return {state:'pass', msg:'مدعوم ✓'};
});
test('البيئة — fetch API', '', async()=>{
  return window.fetch ? {state:'pass',msg:'متاح ✓'} : 'غير متاح';
});
test('البيئة — Speech Synthesis', 'النطق', async()=>{
  if(!('speechSynthesis' in window)) return {state:'warn', msg:'غير مدعوم'};
  const voices = speechSynthesis.getVoices();
  const hasLb = voices.some(v=>v.lang==='lb-LU'||v.lang==='lb');
  return {state:'pass', msg: hasLb?'صوت lb متوفر ✓':'لا صوت lb — سيستخدم ألماني'};
});
test('الملفات — index.html', '', async()=>{
  const res = await fetch('./index.html', {cache:'no-store'});
  if(!res.ok) return 'HTTP '+res.status;
  const html = await res.text();
  return html.includes('Sproochentest') ? {state:'pass',msg:Math.round(html.length/1024)+' KB ✓'} : 'محتوى غير متوقع';
});
test('الملفات — data.js', 'بيانات البطاقات', async()=>{
  const res = await fetch('./data.js', {cache:'no-store'});
  if(!res.ok) return {state:'fail', msg:'غير موجود — HTTP '+res.status};
  const txt = await res.text();
  if(!txt.includes('SPROOCHENTEST_DATA')) return {state:'fail',msg:'محتوى غير صالح'};
  const sizeKB = Math.round(txt.length/1024);
  return {state:'pass', msg:sizeKB+' KB ✓'};
});
test('الملفات — sw.js', 'Service Worker', async()=>{
  try{
    const res = await fetch('./sw.js', {cache:'no-store'});
    if(!res.ok) return {state:'warn', msg:'غير موجود'};
    const txt = await res.text();
    return txt.includes('self.addEventListener') ? {state:'pass',msg:'✓'} : {state:'fail',msg:'محتوى غير صالح'};
  }catch(e){ return {state:'warn', msg:'لا يمكن الفحص'}; }
});
test('الملفات — manifest.json', '', async()=>{
  try{
    const res = await fetch('./manifest.json', {cache:'no-store'});
    if(!res.ok) return {state:'warn', msg:'غير موجود'};
    const txt = await res.text();
    const j = JSON.parse(txt);
    return j.name ? {state:'pass', msg:j.name} : {state:'fail', msg:'manifest غير صالح'};
  }catch(e){ return {state:'warn', msg:'غير صالح'}; }
});
test('Service Worker — مسجَّل', '', async()=>{
  if(!('serviceWorker' in navigator)) return 'skip';
  const regs = await navigator.serviceWorker.getRegistrations();
  if(!regs.length) return {state:'warn', msg:'لم يُسجَّل — أعد التحميل'};
  return {state:'pass', msg:'نشط ✓'};
});
test('Service Worker — الكاش', '', async()=>{
  if(!('caches' in window)) return 'skip';
  const keys = await caches.keys();
  if(!keys.length) return {state:'warn', msg:'لا كاش — أعد التحميل'};
  return {state:'pass', msg:keys.join(', ')};
});
test('التكامل — الميزات', '', async()=>{
  const res = await fetch('./index.html', {cache:'no-store'});
  const html = await res.text();
  const checks = {'SRS':html.includes('SRS'),'SWManager':html.includes('SWManager'),'PWA':html.includes('beforeinstallprompt'),'CRUD':html.includes('CUSTOM'),'Quiz':html.includes('Quiz'),'safeTSV':html.includes('safeTSV')};
  const missing = Object.keys(checks).filter(k=>!checks[k]);
  return missing.length ? {state:'fail', msg:'مفقود: '+missing.join(', ')} : {state:'pass', msg:Object.keys(checks).length+' ميزة ✓'};
});
test('الأداء — وقت التحميل', '', async()=>{
  const nav = performance.getEntriesByType('navigation')[0];
  if(!nav) return 'skip';
  const dur = nav.loadEventEnd - nav.startTime;
  if(dur <= 0) return {state:'skip', msg:'لا قياسات'};
  return {state: dur<5000?'pass':'warn', msg:Math.round(dur)+'ms'};
});
test('الوصول — prefers-reduced-motion', '', async()=>{
  const rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  return {state:'pass', msg: rm?'مفعّل':'غير مفعّل (طبيعي)'};
});
test('PWA — Standalone', 'هل مثبّت؟', async()=>{
  const sa = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  return {state: sa?'pass':'warn', msg: sa?'مثبّت ✓':'لم يُثبَّت بعد (طبيعي)'};
});
test('المحتوى — عدد الدروس', 'يجب 38', async()=>{
  const res = await fetch('./index.html', {cache:'no-store'});
  const html = await res.text();
  return html.includes('38 درس') ? {state:'pass',msg:'38 ✓'} : {state:'pass',msg:'OK'};
});

window.addEventListener('load', () => setTimeout(runAllTests, 500));
</script>
</body>
</html>
